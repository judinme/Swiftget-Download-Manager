ShortDescription: High-performance IDM-class download accelerator with BitTorrent and media grabber integration for Windows 10/11.
Description: |
  SwiftGet is a high-performance IDM-class download accelerator for Windows 10/11 featuring:
  - Multi-segment dynamic splitting with adaptive thread scaling
  - 100% IDM behavioral parity with modern WinUI 3 fluent design
  - Full BitTorrent and Magnet protocol integration (v1/v2, DHT, PeX, LSD)
  - YouTube, HLS, and DASH media grabber integration
  - Native messaging browser extensions for Chrome, Edge, and Firefox
